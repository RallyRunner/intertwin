<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}.p{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}.d{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-inverse);font-weight:700;font-size:15px}.p span{font:var(--type-data);font-size:9px;color:var(--text-faint)}.row{display:flex;gap:6px}</style></head><body>
<div class="row">
<div class="p"><div class="d" style="background:var(--persona-1)">MA</div><span>--persona-1</span></div><div class="p"><div class="d" style="background:var(--persona-2)">DE</div><span>--persona-2</span></div><div class="p"><div class="d" style="background:var(--persona-3)">PR</div><span>--persona-3</span></div><div class="p"><div class="d" style="background:var(--persona-4)">TA</div><span>--persona-4</span></div><div class="p"><div class="d" style="background:var(--persona-5)">RE</div><span>--persona-5</span></div><div class="p"><div class="d" style="background:var(--persona-6)">JO</div><span>--persona-6</span></div><div class="p"><div class="d" style="background:var(--persona-7)">SA</div><span>--persona-7</span></div><div class="p"><div class="d" style="background:var(--persona-8)">NI</div><span>--persona-8</span></div>
</div></body></html>
