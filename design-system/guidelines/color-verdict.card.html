<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--surface-page);font:var(--type-body);color:var(--text-primary)}.sw{flex:1;min-width:0;border-radius:var(--radius-sm);border:1px solid var(--border-hairline);height:76px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}.sw b{font:var(--type-data);font-size:var(--text-3xs);display:block}.sw span{font:var(--type-data);font-size:9.5px;color:var(--text-faint);display:block;margin-top:2px}.row{display:flex;gap:8px}.pair{flex:1}.dim{height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;padding:0 10px;font:var(--type-data);font-size:var(--text-3xs);margin-top:6px}</style></head><body>

</div></body></html>
