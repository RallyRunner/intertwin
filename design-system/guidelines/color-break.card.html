<!-- @dsCard group="Colors" viewport="700x170" name="Light break" subtitle="The one inverted band — flat, sharp-edged, at most once per page" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page)}</style></head><body>
<div style="padding:16px 18px;font:var(--type-telemetry);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-secondary)">dark section</div>
<div style="background:var(--surface-break);color:var(--text-on-break);padding:22px 18px">
<div style="font:var(--type-telemetry);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-on-break-muted);margin-bottom:10px">--surface-break #c8c6c2</div>
<div style="font:var(--type-display);font-size:30px;line-height:1.05;letter-spacing:-.02em">One number destroys all of it.</div>
<div style="border-top:1px solid var(--border-on-break);margin-top:14px;padding-top:10px;font:var(--type-telemetry);color:var(--text-on-break-muted)">--text-on-break #14141a &nbsp;·&nbsp; --text-on-break-muted #4e4e58 &nbsp;·&nbsp; --border-on-break</div>
</div>
<div style="padding:16px 18px;font:var(--type-telemetry);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--text-secondary)">dark section — no radius, no border, full bleed</div>
</body></html>
