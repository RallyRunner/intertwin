<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--surface-page)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Field, Input, Select, Switch, Slider, Checkbox } = window.IntertwinDesignSystem_276e72;
function Demo(){
  const [price,setPrice]=React.useState(38);
  const [frag,setFrag]=React.useState(true);
  const [clin,setClin]=React.useState(false);
  const [inc,setInc]=React.useState(true);
  return <div className="grid">
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Field label="Product name"><Input placeholder="Lumina 15% Vitamin C Serum"/></Field>
      <Field label="Evidence type" hint="Consumer tests read weaker to evidence-driven personas."><Select options={['Consumer test (n=128)','Clinical study','No evidence cited']}/></Field>
      <Field label="Unit price" ><Input prefix="$" suffix="USD" value="38.00" onChange={()=>{}}/></Field>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <Field label="Price" value={'$'+price} hint="Panel re-reacts as you drag.">
        <Slider min={24} max={48} value={price} onChange={setPrice} minLabel="$24" maxLabel="$48"/>
      </Field>
      <div>
        <Switch label="Fragrance-free reformulation" checked={frag} onChange={setFrag} style={{borderTop:'none'}}/>
        <Switch label="Upgrade to clinical study claim" checked={clin} onChange={setClin} style={{borderTop:'1px solid var(--border-hairline)'}}/>
      </div>
      <Checkbox checked={inc} onChange={setInc} label="Include Priya in this run"/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
